---
engines:
  duplication:
    enabled: true
    exclude_paths:
      - "docs/archive/**"
      - "tests/**"
  pylint:
    enabled: true
    exclude_paths:
      - "docs/archive/**"
      - "*.txt"
      - "requirements*.txt"
  bandit:
    enabled: true
    exclude_paths:
      - "docs/archive/**"
      - "tests/**"
  shellcheck:
    enabled: true

exclude_paths:
  - "docs/archive/**"
  - "*.txt"
