# =============================================================================
# Codacy Security Scan Workflow for Termux-Sentinel
# Analyzes Python and Shell scripts for vulnerabilities and code quality issues
# =============================================================================

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 2'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read           # For actions/checkout to fetch code
      security-events: write   # For github/codeql-action/upload-sarif to upload SARIF results
      actions: read            # Required to get the Action run status

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Codacy Analysis CLI
        continue-on-error: true
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.5
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      # -----------------------------------------------------------------------
      # Merge all Codacy engine runs into ONE run and de-duplicate artifacts.
      # -----------------------------------------------------------------------
      - name: Normalize and de-duplicate SARIF
        if: always()
        run: |
          if [ ! -s results.sarif ]; then
            echo "No SARIF file generated or file is empty, skipping normalization."
            exit 0
          fi

          sudo chmod 666 results.sarif

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          sarif_path = Path("results.sarif")
          try:
              with sarif_path.open("r", encoding="utf-8") as fh:
                  content = fh.read().strip()
                  if not content:
                      print("SARIF content is empty.")
                      raise SystemExit(0)
                  data = json.loads(content)
          except Exception as exc:
              print(f"Skipping normalization: {exc}")
              raise SystemExit(0)

          runs = data.get("runs", [])
          if not runs:
              print("SARIF has no runs, nothing to do.")
              raise SystemExit(0)

          # -------------------------------------------------------------------
          # 1. Collect and de-duplicate artifacts across all runs.
          #    An artifact is uniquely identified by its location.uri and
          #    location.uriBaseId (if present).
          # -------------------------------------------------------------------
          artifact_map = {}          # key -> artifact object
          for run in runs:
              for artifact in run.get("artifacts", []):
                  loc = artifact.get("location", {})
                  uri = loc.get("uri", "")
                  base = loc.get("uriBaseId", "")
                  # Normalise spaces in URIs (GitHub expects RFC 3986 URIs)
                  uri = uri.replace(" ", "%20")
                  key = (uri, base)
                  if key not in artifact_map:
                      # store a shallow copy with the normalised URI
                      new_art = dict(artifact)
                      new_loc = dict(loc)
                      new_loc["uri"] = uri
                      new_art["location"] = new_loc
                      artifact_map[key] = new_art

          unique_artifacts = list(artifact_map.values())

          # -------------------------------------------------------------------
          # 2. Merge rules (by rule id) and results.
          # -------------------------------------------------------------------
          merged_rules = []
          seen_rule_ids = set()
          merged_results = []

          for run in runs:
              driver = run.get("tool", {}).get("driver", {})
              for rule in driver.get("rules", []):
                  rid = rule.get("id")
                  if rid and rid not in seen_rule_ids:
                      seen_rule_ids.add(rid)
                      merged_rules.append(rule)
              merged_results.extend(run.get("results", []))

          # -------------------------------------------------------------------
          # 3. Build the single normalized run.
          # Filter out cosmetic style/naming/formatting issues to isolate true security findings
          # -------------------------------------------------------------------
          COSMETIC_PREFIXES = (
              "PyLint", "Prospector", "markdownlint", "remark-lint", "Ruff"
          )
          filtered_results = [
              res for res in merged_results
              if not any(res.get("ruleId", "").startswith(pfx) for pfx in COSMETIC_PREFIXES)
          ]

          merged_run = {
              "tool": {
                  "driver": {
                      "name": "Codacy Security Analysis",
                      "rules": merged_rules,
                  }
              },
              "results": filtered_results,
              "artifacts": unique_artifacts,
          }

          data["runs"] = [merged_run]

          with sarif_path.open("w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2)

          print(
              f"Merged {len(runs)} run(s) into 1. "
              f"De-duplicated artifacts: {sum(len(r.get('artifacts', [])) for r in runs)} -> {len(unique_artifacts)}. "
              f"Results: {len(merged_results)}."
          )
          PY

      - name: Upload SARIF results file
        if: hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: codacy        # helps avoid clashes with other SARIF uploads
