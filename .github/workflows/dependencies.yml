name: Update Dependencies

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-python-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pip-tools
        run: pip install --upgrade pip pip-tools

      - name: Compile and update requirements
        run: |
          pip-compile --upgrade -o requirements.txt pyproject.toml
          pip-compile --extra dev --upgrade -o requirements-dev.txt pyproject.toml

      - name: Create Pull Request for Python deps
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Python packages"
          branch: deps/weekly-update
          title: "chore(deps): automated dependency update"
          body: "Dependencies were updated automatically by pip-compile against pyproject.toml."
          labels: dependencies, python
          delete-branch: true
