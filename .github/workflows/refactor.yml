name: Refactor & Cleanup

on:
  schedule:
    - cron: '0 5 * * 3'   # Every Wednesday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install tools
        run: pip install isort autoflake radon

      - name: Sort imports
        run: isort . || true

      - name: Remove dead code
        run: autoflake --in-place --remove-all-unused-imports --remove-unused-variables -r . || true

      - name: Complexity report
        run: radon cc . -s -a || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "refactor: clean imports & dead code"
          branch: refactor/auto-cleanup
          title: "refactor: automated import & dead-code cleanup"
          body: |
            This PR was generated automatically.
            - Sorted imports with isort
            - Removed unused imports/variables with autoflake
            - Complexity report attached below (see job logs)
          labels: refactor, automated
