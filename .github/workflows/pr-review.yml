name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff (GitHub annotations)
        run: ruff check . --output-format=github --exit-zero

      - name: Run Ruff format check (informational)
        continue-on-error: true
        run: ruff format --check .

  review-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ShellCheck review
        run: |
          shellcheck $(find . -name "*.sh" -not -path "./docs/*") || true
